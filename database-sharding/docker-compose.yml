version: '3.8'

services:
  shard1:
    image: postgres:15
    container_name: shard1
    environment:
      POSTGRES_USER: sharding
      POSTGRES_PASSWORD: sharding123
      POSTGRES_DB: shard1
    ports:
      - "5432:5432"
    volumes:
      - shard1_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharding"]
      interval: 5s
      timeout: 5s
      retries: 5

  shard2:
